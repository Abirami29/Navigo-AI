resources:
  jobs:
    navigo_poi_sync:
      name: navigo-poi-sync
      description: >
        Syncs accessibility and kid-friendly POI tags (wheelchair access, changing
        tables, highchairs, playgrounds) from OpenStreetMap Overpass API into the
        activities table for every active destination. Runs daily and batches
        requests per Overpass usage etiquette — never called live per user request.
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"    # daily at 03:00 UTC
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: sync_overpass_poi
          notebook_task:
            notebook_path: ../../notebooks/01_ingest_seed_destinations.py
            base_parameters:
              mode: refresh_poi_only
              # Only port/db here — no hostname. The host embeds your
              # workspace ID and is fetched from the navigo_secrets scope
              # by the notebook itself, never committed as a plain value.
              lakebase_port: "5432"
              lakebase_db: databricks_postgres
          # No environment_key here deliberately: notebook_task doesn't
          # support job-level environment blocks (the Jobs API rejects that
          # combination — this is what caused the "Invalid platform channel
          # Client-1" deploy failure). Dependencies are installed by the
          # notebook's own %pip install -r ../requirements.txt cell instead,
          # which is the correct mechanism for notebook tasks on serverless.
