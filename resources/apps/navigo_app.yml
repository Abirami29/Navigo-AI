resources:
  apps:
    navigo_app:
      name: navigo
      description: Family holiday planner UI — trip setup, itinerary, and the agent's decision log.
      source_code_path: ../../src/navigo/app
      resources:
        - name: lakebase-user
          description: Lakebase username (see .env.example for the local-dev equivalent)
          secret:
            scope: ${var.lakebase_secret_scope}
            key: lakebase_user
            permission: READ
        - name: lakebase-password
          description: Lakebase password
          secret:
            scope: ${var.lakebase_secret_scope}
            key: lakebase_password
            permission: READ
        - name: model-serving
          description: Foundation model endpoint used by the planning agent
          serving_endpoint:
            name: ${var.model_serving_endpoint}
            permission: CAN_QUERY
